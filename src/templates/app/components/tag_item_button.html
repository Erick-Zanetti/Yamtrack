{% if has_tag %}
  <button hx-post="{% url 'media_tag_toggle' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"tag_id": "{{ tag.id }}", "media_type": "{{ media_type }}", "instance_id": "{{ instance_id }}"}'
          hx-swap="outerHTML"
          class="px-3 py-1 rounded transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-opacity-50 bg-emerald-600 hover:bg-emerald-700 text-white text-sm">
    Remove
  </button>
{% else %}
  <button hx-post="{% url 'media_tag_toggle' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"tag_id": "{{ tag.id }}", "media_type": "{{ media_type }}", "instance_id": "{{ instance_id }}"}'
          hx-swap="outerHTML"
          class="px-3 py-1 rounded transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-opacity-50 bg-gray-500 hover:bg-gray-600 text-white text-sm">
    Add
  </button>
{% endif %}
